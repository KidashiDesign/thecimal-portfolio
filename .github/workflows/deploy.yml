# Baut die Seite bei jedem Push auf main und veröffentlicht sie auf
# GitHub Pages: https://kidashidesign.github.io/Thecimal/
#
# EINMALIGE EINRICHTUNG (muss im Browser passieren):
#   Repository → Settings → Pages → "Build and deployment" →
#   Source auf "GitHub Actions" stellen.
# Danach läuft alles automatisch.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Erlaubt es, den Workflow im Actions-Tab von Hand zu starten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Läuft immer nur ein Deploy gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Pakete installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5
        with:
          # Schaltet GitHub Pages automatisch ein, falls es noch aus ist.
          # Ohne das schlägt der Schritt mit "Get Pages site failed" fehl und
          # man müsste die Einstellung von Hand im Browser setzen.
          enablement: true

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
